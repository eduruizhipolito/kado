<div class="w-full flex justify-between items-start pt-4">
<span class="font-label-caps text-label-caps tracking-widest text-on-secondary-fixed/50 uppercase">KAdó</span>
<span class="font-label-caps text-label-caps text-on-secondary-fixed/50 lowercase tracking-wider" id="network-pill">
      en línea
    </span>
</div>
<div class="flex flex-col items-center justify-center my-auto text-center w-full">
<div class="relative flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-secondary-fixed/60 uppercase tracking-widest mb-3">
        Saldo Disponible
      </span>
<h1 class="font-display-hero-mobile text-display-hero-mobile text-on-secondary-fixed tracking-tight">
        $2.00
      </h1>
<span class="font-label-mono-equivalent text-label-mono-equivalent text-on-secondary-fixed/50 mt-2 tracking-wide">
        USDC
      </span>
</div>
<div class="mt-12 space-y-6 flex flex-col items-center w-full">
<button class="group relative font-body-lg text-body-lg text-on-secondary-fixed transition-opacity duration-200 hover:opacity-75 active:opacity-50 py-1 bg-transparent border-0 cursor-pointer text-center" id="save-access-btn" type="button">
<span class="">Guardar mi acceso</span>
<div class="w-0 group-hover:w-full h-hairline bg-on-secondary-fixed/40 transition-all duration-300 mx-auto mt-0.5"></div>
</button>
<button class="group relative font-body-lg text-body-lg text-on-secondary-fixed transition-opacity duration-200 hover:opacity-75 active:opacity-50 py-1 bg-transparent border-0 cursor-pointer text-center" id="transfer-btn" type="button">
<span class="">Enviar a otro lado</span>
<div class="w-0 group-hover:w-full h-hairline bg-on-secondary-fixed/40 transition-all duration-300 mx-auto mt-0.5"></div>
</button>
</div>
</div>
<div class="pb-4 text-center w-full flex flex-col items-center space-y-2">
<p class="font-label-mono-equivalent text-label-mono-equivalent text-on-secondary-fixed/70 tracking-normal transition-opacity duration-300" id="footnote-text">
      Guarda este enlace para volver a entrar.
    </p>
<div class="font-label-caps text-label-caps text-on-secondary-fixed/30 tracking-widest uppercase">
      0x4F92...B831
    </div>
</div>
</div>
<script>
  (function() {
    const saveBtn = document.getElementById('save-access-btn');
    const sendBtn = document.getElementById('transfer-btn');
    const note = document.getElementById('footnote-text');
    let timeoutId;

    function flashNotice(text) {
      if (!note) return;
      clearTimeout(timeoutId);
      note.style.opacity = '0';
      setTimeout(() => {
        note.textContent = text;
        note.style.opacity = '1';
        timeoutId = setTimeout(() => {
          note.style.opacity = '0';
          setTimeout(() => {
            note.textContent = 'Guarda este enlace para volver a entrar.';
            note.style.opacity = '1';
          }, 300);
        }, 3200);
      }, 250);
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        if (navigator.clipboard && window.location.href) {
          navigator.clipboard.writeText(window.location.href).then(() => {
            flashNotice('Enlace copiado al portapapeles');
          }).catch(() => {
            flashNotice('Usa el menú de tu navegador para guardar');
          });
        } else {
          flashNotice('Añade esta página a tus favoritos');
        }
      });
    }

    if (sendBtn) {
      sendBtn.addEventListener('click', () => {
        flashNotice('Próximamente disponible en Lima');
      });
    }
  })();
</script></main>
